name: Backend CI

on:
  push:
    branches: [ main, backend-v1.0.0, backend-v1.1.0-complete ]
  pull_request:
    branches: [ main, backend-v1.0.0, backend-v1.1.0-complete ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Nova.sln

      - name: Build
        run: dotnet build Nova.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Nova.sln --configuration Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t nova-backend:1.1.0 -t nova-backend:ci .
