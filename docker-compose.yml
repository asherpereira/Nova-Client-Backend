services:
  nova:
    build: .
    container_name: nova-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__NovaDatabase: Host=postgres;Port=5432;Database=nova;Username=nova;Password=${NOVA_DB_PASSWORD}
      Jwt__Key: ${NOVA_JWT_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${NOVA_DB_PASSWORD}
    volumes:
      - nova-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nova-postgres-data:
